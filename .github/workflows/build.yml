# -> goes to .github/workflows/build.yml in the public repo
name: build
on:
  # GitHub's own cron is retired (08.07) — measured over 15 runs it started
  # 60 min (morning) to 150 min (midday) late, and dropped a slot entirely
  # twice (07-31, 08-07: no build at all, so no push and no history row). The
  # schedule now lives in the Cloudflare push worker's Cron Trigger, which
  # calls this workflow through workflow_dispatch with notify=true at 05:30 /
  # 13:00 VN (engine/worker.js + cfops.py CRON). Keeping the entries below as
  # a backup does not work: a late GitHub run no longer overlaps the CF-driven
  # one, so the pages concurrency group cannot cancel it and the device gets a
  # second push. If the PAT expires (2026-11-09) or CF fails, dispatch by hand
  # (`python ghops.py dispatch '{"notify": true}'`) or re-enable these:
  #   schedule:
  #     - cron: "13 22 * * *"   # ~05:30 VN
  #     - cron: "17 5 * * *"    # ~12:30 VN
  workflow_dispatch:
    inputs:
      notify:
        description: "send web push after deploy"
        type: boolean
        default: false

permissions:
  contents: write   # history.enc is committed back by the build (08.05)
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install cryptography
      - name: materialize config
        env:
          DASH_CONFIG_B64: ${{ secrets.DASH_CONFIG_B64 }}
        run: echo "$DASH_CONFIG_B64" | base64 -d > config.json
      - name: pull
        env:
          BACKLOG_API_KEY: ${{ secrets.BACKLOG_API_KEY }}
        run: python pull.py --config config.json --out cache/data.json
      # history accumulation (08.05): upsert today's per-project aggregate counts
      # into history.enc (same AES-GCM envelope as the pages — counts only, but
      # category/type vocabulary is internal) and commit it back. The pull is
      # ephemeral; trends exist only because each build leaves this trace.
      - name: accumulate history
        env:
          SITE_KEY: ${{ secrets.SITE_KEY }}
        run: |
          python history.py --config config.json --data cache/data.json --file history.enc --enc-env SITE_KEY
          if [ -n "$(git status --porcelain history.enc)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add history.enc
            git commit -m "update history"
            git push origin HEAD:main || (git fetch origin main && git rebase origin/main && git push origin HEAD:main)
          else
            echo "history unchanged"
          fi
      - name: materialize insight (optional — absent secret = section hidden)
        env:
          DASH_INSIGHT_B64: ${{ secrets.DASH_INSIGHT_B64 }}
        run: |
          mkdir -p cache
          if [ -n "$DASH_INSIGHT_B64" ]; then echo "$DASH_INSIGHT_B64" | base64 -d > cache/insight.json; fi
      - name: build (encrypted)
        env:
          SITE_KEY: ${{ secrets.SITE_KEY }}
          # web push config — embedded into the ENCRYPTED payload only; absent
          # secrets = bell hidden, build still fine
          PUSH_VERIFIER: ${{ secrets.PUSH_VERIFIER }}
          PUSH_WORKER_URL: ${{ secrets.PUSH_WORKER_URL }}
          VAPID_PUBLIC: ${{ secrets.VAPID_PUBLIC }}
        run: python build.py --config config.json --data cache/data.json --outdir dist --enc-env SITE_KEY
      # /next standing preview (07.31): the feedback-revision build. Same data
      # pull, next/'s own template+build. Absent next/ folder -> step skipped,
      # nothing else changes. Promote = next/* replaces the root engine files.
      - name: build /next preview (skipped when next/ absent)
        if: ${{ hashFiles('next/build.py') != '' }}
        env:
          SITE_KEY: ${{ secrets.SITE_KEY }}
          PUSH_VERIFIER: ${{ secrets.PUSH_VERIFIER }}
          PUSH_WORKER_URL: ${{ secrets.PUSH_WORKER_URL }}
          VAPID_PUBLIC: ${{ secrets.VAPID_PUBLIC }}
        run: python next/build.py --config config.json --data cache/data.json --insight cache/insight.json --outdir dist/next --enc-env SITE_KEY --variant next
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # web push "updated" ping — scheduled builds only (manual dispatch: opt-in
  # via the notify input), and only AFTER a successful deploy. No push
  # secrets configured -> job exits quietly.
  notify:
    needs: deploy
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.notify)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pywebpush
      - name: send web push
        env:
          PUSH_WORKER_URL: ${{ secrets.PUSH_WORKER_URL }}
          PUSH_LIST_TOKEN: ${{ secrets.PUSH_LIST_TOKEN }}
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
          SITE_URL: https://tl-khoinguyen.github.io/tl-dashboards
        run: |
          if [ -z "$PUSH_WORKER_URL" ]; then echo "push not configured — skip"; exit 0; fi
          python push_send.py
