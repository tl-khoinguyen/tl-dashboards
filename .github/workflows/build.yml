# -> goes to .github/workflows/build.yml in the public repo
name: build
on:
  schedule:
    # 04:47 VN / 06:47 JP. GitHub cron has NO exact-time SLA — runs queue and
    # typically start 15-60+ min late (the 05:30 slot ran at 06:30 on 07-29).
    # Odd minute + earlier slot so the site is fresh by the VN workday anyway.
    - cron: "47 21 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install cryptography
      - name: materialize config
        env:
          DASH_CONFIG_B64: ${{ secrets.DASH_CONFIG_B64 }}
        run: echo "$DASH_CONFIG_B64" | base64 -d > config.json
      - name: pull
        env:
          BACKLOG_API_KEY: ${{ secrets.BACKLOG_API_KEY }}
        run: python pull.py --config config.json --out cache/data.json
      - name: materialize insight (optional — absent secret = section hidden)
        env:
          DASH_INSIGHT_B64: ${{ secrets.DASH_INSIGHT_B64 }}
        run: |
          mkdir -p cache
          if [ -n "$DASH_INSIGHT_B64" ]; then echo "$DASH_INSIGHT_B64" | base64 -d > cache/insight.json; fi
      - name: build (encrypted)
        env:
          SITE_KEY: ${{ secrets.SITE_KEY }}
        run: python build.py --config config.json --data cache/data.json --outdir dist --enc-env SITE_KEY
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
