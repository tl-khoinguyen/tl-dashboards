<!-- single theme-color, JS-synced to the APP theme toggle (data-theme) — media-query

<style>
:root{
  --bg:#F5F7FA; --panel:#FFFFFF; --panel2:#F0F3F7; --border:#E4E8EF;
  --text:#161D2B; --muted:#4C5666; --faint:#6A7688;
  --accent:#2563EB; --accent-soft:#E8EFFE;
  --green:#12805C; --green-soft:#E1F3EC; --amber:#B45309; --amber-soft:#FBEFDD;
  --red:#DC2626; --red-soft:#FBE6E6; --grid:#EEF1F5;
  /* Backlog standard status palette (operator decision 07.28) — per-project real
     status colors from the API override these at runtime (loadProject) */
  --st-open:#ed8077; --st-inprog:#4488c5; --st-resolved:#5eb5a6; --st-pending:#eda62a; --st-closed:#b0be3c;
  /* categorical palette for the AREA dimension (validated, distinct from status) */
  --a1:#2a78d6; --a2:#eb6834; --a3:#1baf7a; --a4:#eda100; --a5:#e87ba4;
  --shadow:0 1px 2px rgba(20,30,50,.05),0 2px 8px rgba(20,30,50,.05);
  --radius:14px;
}
html[data-theme="dark"]{
  --bg:#0A1120; --panel:#101B30; --panel2:#16233B; --border:#243452;
  --text:#E7EEF9; --muted:#93A4C0; --faint:#61728F;
  --accent:#5B9BFF; --accent-soft:#16294A;
  --green:#3DD3A0; --green-soft:#123528; --amber:#F5B463; --amber-soft:#3A2A12;
  --red:#F87171; --red-soft:#3A1B1E; --grid:#1B2A45;
  --st-open:#ed8077; --st-inprog:#4488c5; --st-resolved:#5eb5a6; --st-pending:#eda62a; --st-closed:#b0be3c;
  --a1:#3987e5; --a2:#d95926; --a3:#199e70; --a4:#c98500; --a5:#d55181;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:system-ui,-apple-system,'Segoe UI',Roboto,'Hiragino Kaku Gothic ProN','Yu Gothic',Meiryo,sans-serif;
  background:var(--bg);color:var(--text);line-height:1.6;font-size:16.7px;-webkit-font-smoothing:antialiased;transition:background .2s,color .2s;}
.wrap{max-width:1060px;margin:0 auto;position:relative;
  padding:calc(20px + env(safe-area-inset-top,0px)) 18px calc(64px + env(safe-area-inset-bottom,0px));}
/* utility cluster (lang/theme, future settings) — top-right, outside the filter bar */
.util{position:absolute;top:calc(20px + env(safe-area-inset-top,0px));right:18px;display:flex;gap:8px;z-index:20;}
.mono{font-variant-numeric:tabular-nums;font-feature-settings:"tnum";}
/* top bar */
.projnav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px;padding-bottom:16px;border-bottom:2px solid var(--border);}
.projnav:empty{display:none;}
.projnav button{font:inherit;font-size:15px;font-weight:700;padding:9px 18px;border:1px solid var(--border);background:var(--panel);color:var(--muted);border-radius:10px;cursor:pointer;transition:all .12s;}
.projnav button:hover{border-color:var(--accent);color:var(--text);}
.projnav button.on{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:var(--shadow);}
.top{display:flex;flex-direction:column;gap:14px;margin-bottom:16px;}
.controls{padding-top:12px;border-top:1px solid var(--border);}
.brand{display:flex;flex-direction:column;gap:2px;}
.brand .ey{font-size:12.6px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-weight:600;}
.brand h1{font-size:23px;font-weight:700;letter-spacing:-.01em;}
.brand .sub{font-size:13.8px;color:var(--muted);}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;}
.ctl{display:flex;flex-direction:column;gap:3px;}
.ctl label{font-size:11.5px;color:var(--faint);letter-spacing:.03em;padding-left:2px;}
select,.btn{font:inherit;font-size:14.9px;color:var(--text);background:var(--panel);border:1px solid var(--border);
  border-radius:9px;padding:7px 10px;cursor:pointer;transition:border .15s;}
select:hover,.btn:hover{border-color:var(--accent);}
.seg{display:flex;border:1px solid var(--border);border-radius:9px;overflow:hidden;background:var(--panel);}
.seg button{font:inherit;font-size:14.4px;padding:7px 11px;background:transparent;border:0;color:var(--muted);cursor:pointer;}
.seg button.on{background:var(--accent);color:#fff;}
/* one-box language toggle: only the current language's flag is visible */
.langbtn{display:flex;align-items:center;justify-content:center;}
.langbtn svg{display:none;}
.langbtn svg.on{display:block;}
.iconbtn{width:38px;height:38px;display:flex;align-items:center;justify-content:center;font-size:18.4px;}
/* install button — accent-styled so it reads as a call-to-action among the
   muted util icons; .pulse glows a few beats on FIRST sighting only */
#btn-install{color:var(--accent);border-color:var(--accent);background:var(--accent-soft);}
#btn-install:hover{filter:brightness(1.06);}
@keyframes instglow{0%,100%{box-shadow:0 0 0 0 transparent;}
  50%{box-shadow:0 0 0 7px color-mix(in srgb,var(--accent) 32%,transparent);}}
#btn-install.pulse{animation:instglow 1.5s ease-in-out 4;}
/* bell states: off = muted outline · busy = swinging (request in flight) ·
   on = solid accent fill so the subscribed state is unmissable */
#btn-push.on{color:var(--accent);border-color:var(--accent);background:var(--accent-soft);}
#btn-push.on svg{fill:var(--accent);}
@keyframes bellswing{0%,100%{transform:rotate(0);}25%{transform:rotate(14deg);}75%{transform:rotate(-14deg);}}
#btn-push.busy svg{animation:bellswing .6s ease-in-out infinite;transform-origin:50% 15%;}
#pushtoast{position:fixed;top:calc(66px + env(safe-area-inset-top,0px));right:18px;z-index:90;
  background:var(--panel);color:var(--text);border:1px solid var(--border);border-radius:10px;
  padding:9px 14px;font-size:14.5px;box-shadow:var(--shadow);max-width:min(320px,80vw);
  opacity:0;transition:opacity .25s;pointer-events:none;}
#pushtoast.show{opacity:1;}
/* hero */
.hero{display:grid;grid-template-columns:repeat(auto-fit,minmax(184px,1fr));gap:12px;margin:18px 0;}
.kcard{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:16px 16px 14px;box-shadow:var(--shadow);position:relative;overflow:hidden;}
.kcard .top-dot{position:absolute;top:0;left:0;width:100%;height:3px;}
.kcard .klbl{font-size:13.8px;color:var(--muted);display:flex;align-items:center;gap:6px;margin-bottom:8px;}
.kcard .kval{font-size:34.5px;font-weight:700;letter-spacing:-.02em;line-height:1;display:flex;align-items:baseline;gap:6px;}
.kcard .kunit{font-size:16.1px;font-weight:600;color:var(--muted);}
.kcard .kmean{font-size:13.8px;color:var(--muted);margin-top:8px;line-height:1.45;}
.kcard .kbadge{display:inline-block;font-size:12.6px;font-weight:600;padding:2px 8px;border-radius:20px;margin-top:9px;}
.g{color:var(--green);} .a{color:var(--amber);} .r{color:var(--red);} .b{color:var(--accent);}
.bg-g{background:var(--green-soft);color:var(--green);} .bg-a{background:var(--amber-soft);color:var(--amber);}
.bg-r{background:var(--red-soft);color:var(--red);} .bg-b{background:var(--accent-soft);color:var(--accent);}
.dot-g{background:var(--green);} .dot-a{background:var(--amber);} .dot-r{background:var(--red);} .dot-b{background:var(--accent);}
.kcard.tone-r{background:linear-gradient(180deg,var(--red-soft),var(--panel) 52%);}
.kcard.tone-a{background:linear-gradient(180deg,var(--amber-soft),var(--panel) 52%);}
.kcard.tone-g{background:linear-gradient(180deg,var(--green-soft),var(--panel) 55%);}
.kcard .kem{font-size:15px;line-height:1;}
.ktag{margin-left:auto;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:6px;white-space:nowrap;}
.kpill{margin:2px 0 1px;}
.hpill{display:inline-flex;align-items:center;gap:7px;font-size:19px;font-weight:800;padding:6px 14px;border-radius:12px;letter-spacing:.01em;}
/* insight */
.insight{background:var(--panel);border:1px solid var(--border);border-left:3px solid var(--accent);
  border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);margin-bottom:18px;}
.insight h2{font-size:14.9px;font-weight:700;display:flex;align-items:center;gap:7px;margin-bottom:8px;}
.insight p{font-size:15.5px;color:var(--text);margin-bottom:7px;}
.insight .hl{font-weight:700;}
.insight ul{margin:4px 0 0 2px;list-style:none;}
.insight li{font-size:14.9px;color:var(--muted);padding-left:16px;position:relative;margin-bottom:4px;}
.insight li::before{content:'';position:absolute;left:2px;top:9px;width:5px;height:5px;border-radius:50%;background:var(--accent);}
/* sections (accordion) */
details.sec{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:12px;box-shadow:var(--shadow);overflow:hidden;}
details.sec>summary{list-style:none;cursor:pointer;padding:15px 18px;display:flex;align-items:center;gap:10px;font-weight:600;font-size:16.1px;user-select:none;}
details.sec>summary::-webkit-details-marker{display:none;}
details.sec>summary .chev{margin-left:auto;color:var(--faint);transition:transform .2s;font-size:13.8px;}
details.sec[open]>summary .chev{transform:rotate(90deg);}
details.sec>summary .si{width:26px;height:26px;border-radius:7px;background:var(--panel2);display:flex;align-items:center;justify-content:center;font-size:16.1px;}
details.sec>summary .cnt{font-size:13.8px;font-weight:500;color:var(--muted);background:var(--panel2);padding:2px 9px;border-radius:20px;}
details.sec>summary .share{border:none;background:none;cursor:pointer;font-size:13.8px;color:var(--faint);padding:2px 6px;border-radius:6px;line-height:1;}
details.sec>summary .share:hover{background:var(--panel2);color:var(--text);}
.secbody{padding:4px 18px 18px;}
/* table */
table{width:100%;border-collapse:collapse;}
th{font-size:12.6px;font-weight:600;color:var(--faint);text-transform:uppercase;letter-spacing:.04em;text-align:left;padding:8px 8px;border-bottom:1px solid var(--border);white-space:nowrap;}
th:not(:first-child),td:not(:first-child){text-align:right;}
td{padding:9px 8px;font-size:15.5px;border-bottom:1px solid var(--grid);}
tr:last-child td{border-bottom:none;}
.name{font-weight:600;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.chip{display:inline-block;font-size:12.6px;font-weight:600;padding:1px 8px;border-radius:6px;}
.sbar{display:inline-flex;height:7px;width:76px;border-radius:4px;overflow:hidden;background:var(--grid);vertical-align:middle;}
.sbar i{height:100%;display:block;box-shadow:inset -1.5px 0 0 0 var(--panel);}
.abar i{font-style:normal;overflow:hidden;white-space:nowrap;display:flex;align-items:center;justify-content:center;}
.abar i b{font-size:10.5px;color:#fff;font-weight:700;text-shadow:0 1px 1px rgba(0,0,0,.4);}
.arow.hid{display:none;}
.asep{border-top:2px solid var(--border);margin:16px 0 14px;}
.bar{display:flex;align-items:center;gap:8px;}
.bar .tk{flex:1;height:8px;border-radius:5px;background:var(--grid);overflow:hidden;}
.bar .tk i{display:block;height:100%;border-radius:5px;}
.morebtn{margin-top:10px;font-size:14.4px;color:var(--accent);background:none;border:none;cursor:pointer;padding:4px;}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:12px;}
.legend span{display:flex;align-items:center;gap:5px;font-size:13.8px;color:var(--muted);}
.legend i{width:9px;height:9px;border-radius:2px;}
.fresh{display:inline-flex;align-items:center;gap:6px;font-size:13.2px;font-weight:600;padding:3px 10px;border-radius:20px;margin-top:7px;width:fit-content;}
.fresh::before{content:'';width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.fresh.g{background:var(--green-soft);color:var(--green);} .fresh.g::before{background:var(--green);}
.fresh.a{background:var(--amber-soft);color:var(--amber);} .fresh.a::before{background:var(--amber);}
.fresh.r{background:var(--red-soft);color:var(--red);} .fresh.r::before{background:var(--red);}
/* sticky filter bar (07.28): normal = full row (filters left, lang/theme right);
   stuck = compact centered CAPSULE fitting just the controls */
.controls{position:sticky;top:env(safe-area-inset-top,0px);z-index:60;background:var(--bg);padding:12px 0 10px;}
.cbar{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;width:100%;}
.cgroup{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;}
.controls.stuck{background:transparent;pointer-events:none;padding:8px 0;}
.controls.stuck .cbar{pointer-events:auto;width:max-content;max-width:100%;margin:0 auto;
  background:var(--panel);border:1px solid var(--border);border-radius:999px;
  padding:7px 18px;box-shadow:0 8px 24px rgba(15,23,42,.16);gap:26px;justify-content:center;align-items:center;}
.controls.stuck .cgroup{align-items:center;}
.controls.stuck .ctl>label{display:none;}
/* narrow screens (07.28 mobile rework): utility cluster becomes its own
   right-aligned row (no absolute overlap with tabs/title); filter bar stays
   a compact full-width card when stuck */
@media (max-width:680px){
  .util{position:static;justify-content:flex-end;margin-bottom:6px;}
  .controls .cbar{align-items:flex-start;}
  .controls .cgroup{gap:8px;flex-wrap:wrap;min-width:0;}
  .controls.stuck .cbar{width:100%;max-width:100%;border-radius:16px;padding:9px 10px;}
  .controls #sel-scope{max-width:150px;font-size:13.2px;}
  .controls .seg button{padding:5px 7px;font-size:13px;white-space:nowrap;}
}
/* back to top */
#totop{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:70;width:42px;height:42px;border-radius:50%;
  border:1px solid var(--border);background:var(--panel);color:var(--muted);font-size:17px;cursor:pointer;
  box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .2s,color .12s,border-color .12s;}
#totop.show{opacity:1;pointer-events:auto;}
#totop:hover{color:var(--text);border-color:var(--accent);}
.stalebar{display:none;border-radius:var(--radius);padding:11px 16px;margin:14px 0 0;font-size:14.9px;font-weight:500;box-shadow:var(--shadow);}
.stalebar.a{background:var(--amber-soft);color:var(--amber);border:1px solid var(--amber);}
.stalebar.r{background:var(--red-soft);color:var(--red);border:1px solid var(--red);}
.stalebar a{color:inherit;font-weight:700;text-decoration:underline;}
.foot{margin-top:26px;padding-top:14px;border-top:1px solid var(--border);font-size:12.6px;color:var(--faint);display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;}
.note{font-size:13.2px;color:var(--faint);margin-top:8px;}
.ailist{margin:4px 0 8px;padding-left:20px;}
.ailist li{margin:7px 0;line-height:1.68;font-size:14.6px;}
/* period vs snapshot signalling (07.28) */
details.sec>summary .cnt.rchip{background:var(--accent-soft);color:var(--accent);font-weight:600;}
.snapdiv{display:flex;align-items:center;gap:12px;margin:30px 0 16px;color:var(--muted);font-size:13.6px;font-weight:600;letter-spacing:.01em;}
.snapdiv::before,.snapdiv::after{content:"";flex:1;border-top:2px dashed var(--border);}
.controls #f-range{transition:opacity .25s;}
.controls.snapzone #f-range{opacity:.35;}
/* movement-in-period section */
.mvstats{display:flex;gap:26px;flex-wrap:wrap;margin:2px 0 4px;}
.mvstat{display:flex;flex-direction:column;gap:1px;}
.mvl{font-size:12.8px;color:var(--muted);}
.mvv{font-size:23px;font-weight:800;}
.mvp{font-size:12.4px;color:var(--faint);}
.mvrow{display:flex;align-items:center;gap:10px;margin-bottom:7px;}
.mvname{width:150px;font-size:14.3px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex-shrink:0;}
.mvbars{flex:1;display:flex;flex-direction:column;gap:2px;}
.mvbar{display:flex;align-items:center;gap:6px;height:9px;}
.mvbar i{display:block;height:100%;border-radius:3px;min-width:2px;}
.mvbar b{font-size:11.8px;color:var(--muted);font-weight:600;line-height:1;}
.mvnet{flex-shrink:0;min-width:42px;text-align:right;font-size:12.8px;font-weight:700;color:var(--muted);}
.mvnet.pos{color:var(--amber);}
.mvplan{margin-left:6px;font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:7px;background:var(--accent-soft);color:var(--accent);vertical-align:1px;}
.mvfin{display:flex;gap:8px 20px;flex-wrap:wrap;font-size:14.4px;}
.mvfin b{color:var(--accent);}
svg{display:block;max-width:100%;}
a.lnk{color:inherit;text-decoration:none;border-bottom:1px dashed var(--faint);transition:color .12s,border-color .12s;}
a.lnk:hover{color:var(--accent);border-color:var(--accent);}
.lock{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px;
  z-index:200;}  /* above EVERYTHING (sticky controls 60, totop 70, toast 90) — pre-unlock nothing may peek through */
.lockcard{background:var(--panel);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);padding:30px 28px;width:100%;max-width:380px;text-align:center;}
.lockcard .lockey{font-size:12.6px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-weight:700;}
.lockcard h2{font-size:23px;font-weight:700;margin:4px 0 14px;}
.lockcard .fresh{margin:0 auto 16px;}
.lockmsg{font-size:14.9px;color:var(--muted);margin-bottom:14px;}
.pw{width:100%;font:inherit;font-size:17.2px;padding:11px 13px;border:1px solid var(--border);border-radius:10px;background:var(--panel2);color:var(--text);text-align:center;letter-spacing:.05em;}
.pw:focus{outline:none;border-color:var(--accent);}
.unlock{width:100%;margin-top:12px;background:var(--accent);color:#fff;border:none;border-radius:10px;padding:11px;font-size:16.1px;font-weight:600;cursor:pointer;}
.pwerr{color:var(--red);font-size:14.4px;margin-top:10px;min-height:16px;display:none;}
.remember{display:flex;align-items:center;gap:7px;justify-content:center;font-size:13px;color:var(--muted);margin-top:12px;cursor:pointer;}
.remember input{width:15px;height:15px;cursor:pointer;accent-color:var(--accent);}
@media(max-width:560px){
  .kcard .kval{font-size:29.9px;}
  .wrap{padding:calc(14px + env(safe-area-inset-top,0px)) 12px calc(48px + env(safe-area-inset-bottom,0px));}
  .brand h1{font-size:20.7px;}
}
/* export (08.03): printer icon beside the project title — different context from
   the page-pref utility cluster (lang/theme/push), so it lives in the header row */
.h1row{display:flex;align-items:center;gap:10px;}
.expwrap{position:relative;}
#btn-export{width:34px;height:34px;color:var(--muted);}
#btn-export:hover{color:var(--text);}
#expmenu{position:absolute;top:40px;left:0;z-index:80;background:var(--panel);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow);padding:6px;display:flex;flex-direction:column;gap:2px;min-width:220px;}
#expmenu button{font:inherit;font-size:14.4px;text-align:left;background:none;border:none;color:var(--text);padding:8px 10px;border-radius:7px;cursor:pointer;white-space:nowrap;}
#expmenu button:hover{background:var(--panel2);}
#expmenu[hidden]{display:none;}
/* print / PDF (08.03): "export what you see" — JS force-opens every section and
   forces light theme (beforeprint), page chrome (filters/buttons/toasts) is
   stripped; the per-assignee area list prints its FIRST page only (.hid rows
   stay hidden by design — operator decision). Colors kept via print-color-adjust. */
@media print{
  .util,.projnav,.controls,#totop,#pushtoast,.stalebar,.share,.morebtn,.expwrap{display:none!important;}
  body{background:#fff;font-size:13.5px;}
  .wrap{max-width:100%;padding:0;}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact;box-shadow:none!important;}
  details.sec>summary{break-after:avoid;}
  details.sec>summary .chev{display:none;}
  .kcard,.insight,.mvrow,.arow,tr,.bar,.legend,.mvstats{break-inside:avoid;}
  a.lnk{border-bottom:none;}
}

   push_on:"🔔 Đã bật thông báo — sẽ báo mỗi sáng khi có dữ liệu mới",push_off:"Đã tắt thông báo",push_err:"Không bật được thông báo — thử lại giúp nhé",push_denied:"Trình duyệt đang chặn thông báo cho trang này",
   sec_risk:"Ticket quá hạn",sec_status:"Phân bố trạng thái",

   th_ticket:"Tiêu đề",th_due:"Hạn",th_days:"Số ngày trễ",

   created:"Tạo",closed:"Đóng",net:"Ròng",week:"Tuần",stalep:"Đình trệ%",

   st:{Open:"Chưa xử lý",InProgress:"Đang xử lý",Resolved:"Đã xử lý",Pending:"Treo",Closed:"Đóng"},
   foot_l:"Backlog Dashboard · tính client-side (chạy offline)",

   exp_t:"Xuất",exp_pdf:"📄 Xuất PDF (in)",exp_html:"🌐 Lưu HTML (một tệp)",

};

/* ============ CONFIG — tunable thresholds & indicators (single place) ============ */
const BASECFG={
  staleDays:30,                 // "stale" = open & untouched more than N days
  overdue:{warn:20,crit:40},    // % of open past-due → amber / red
  stale:{warn:30,crit:50},      // % of open stale → amber / red
  fresh:{warn:3,crit:7},        // freshness badge: amber if >warn days old, red if >crit
  riskMed:{mid:45,high:90},     // member median open-age (days) → 中 / 高 risk chip
  health:{ rateGood:100, rateWarn:70, trendBand:5 }, // V1 07.31: 処理率% (closed ÷ unplanned inflow) cutoffs + flat band for the trend arrow
};
let CFG=BASECFG;                // effective = base + per-project overrides (applyProject)
function mergeCFG(o){
  if(!o||!Object.keys(o).length)return BASECFG;
  const c=JSON.parse(JSON.stringify(BASECFG));
  for(const k in o){ if(o[k]&&typeof o[k]==='object')Object.assign(c[k]=c[k]||{},o[k]); else c[k]=o[k]; }
  return c;
}

/* ============ state ============ */
/* language is a VIEWER preference: persisted per device (07.28), never carried in
   shared links — each viewer sees their own choice (default ja on first visit) */
let LANG=(()=>{try{const v=localStorage.getItem('tl_dash_lang');if(v&&DICT[v])return v;}catch(e){}return 'ja';})();
let SCOPE='all', RANGE=30, A2ID={}, PI=0;
/* tab title carries the page/project slug so multiple open tabs are tellable apart */
const PAGESLUG=(()=>{try{const seg=location.pathname.split('/').filter(s=>s&&!/^index\.html?$/i.test(s));return seg[seg.length-1]||'';}catch(e){return '';}})();
if(PAGESLUG)document.title=PAGESLUG+' · TLダッシュボード';
let RAW=null, CONF=null, PCFG={}, SFULL=[], INSW=null;   // active project's data / deep-link conf / rules / real Backlog statuses / weekly AI insight
const T=()=>DICT[LANG];
const TODAY=new Date(META.today+'T00:00:00Z');
const $=s=>document.querySelector(s);

/* ============ helpers ============ */
const D=s=>s?new Date(s.slice(0,10)+'T00:00:00Z'):null;
const days=(a,b)=>Math.round((b-a)/864e5);
const median=xs=>{if(!xs.length)return 0;const s=[...xs].sort((a,b)=>a-b);const m=s.length>>1;return s.length%2?s[m]:Math.round((s[m-1]+s[m])/2);};
const isDone=i=>i.stId===4;   // status id 4 = Closed/完了 (names are localized — never match by name)
const age=i=>{const c=D(i.created);const e=isDone(i)?D(i.updated):TODAY;return c?days(c,e):null;};
const monday=d=>{const x=new Date(d);const w=(x.getUTCDay()+6)%7;x.setUTCDate(x.getUTCDate()-w);return x;};
const fmtDate=d=>`${d.getUTCFullYear()}/${String(d.getUTCMonth()+1).padStart(2,'0')}/${String(d.getUTCDate()).padStart(2,'0')}`;

/* status → 5-bucket map, keyed by status ID (localization-proof).
   SMAP is injected per project (pull.py heuristic + config overrides). */
let SMAP={};
const bkt=i=>SMAP[i.stId]||'Open';
const BORDER={Open:'var(--st-open)',InProgress:'var(--st-inprog)',Resolved:'var(--st-resolved)',Pending:'var(--st-pending)',Closed:'var(--st-closed)'};
/* category of an issue — mode from per-project config:
   'issueType' = Backlog issue type; 'bracket2' = 2nd 【…】 tag in the title; 'none' */
function normCat(n){n=n.trim();const M=PCFG.catNormalize||{};return M[n]||n;}
function sub(i){
  const mode=PCFG.categoryMode||'issueType';
  if(mode==='bracket2'){const m=[...(i.summary||'').matchAll(/【([^】]+)】/g)].map(x=>x[1]);return m.length>1?normCat(m[1]):'—';}
  if(mode==='issueType')return i.type||'—';
  return '—';
}

/* ============ scopes ============ */
function scopeFilter(id){
  if(id==='all')return()=>true;
  if(id.startsWith('tag:')){const tags=id.slice(4).split('|');return i=>i.summary&&tags.some(tg=>i.summary.includes(tg));}
  if(id==='highp')return i=>i.prId===2;
  if(id==='overdue')return i=>i.dueDate&&D(i.dueDate)<TODAY&&!isDone(i);
  if(id.startsWith('ms:')){const n=id.slice(3);return i=>(i.milestone||[]).includes(n);}
  return()=>true;
}
function scopeName(id){
  const t=T();
  if(id==='all')return t.allopen;
  if(id.startsWith('tag:')){const s=(PCFG.tagScopes||[]).find(x=>x.id===id);return s?(s[LANG]||s.en||id):id.slice(4);}
  if(id==='highp')return t.highp;if(id==='overdue')return t.overdueScope;
  if(id.startsWith('ms:'))return id.slice(3);
  return id;
}

/* ============ compute ============ */
function compute(){
  const f=scopeFilter(SCOPE);
  const scoped=RAW.filter(f);
  const open=scoped.filter(i=>!isDone(i));
  const closedAll=scoped.filter(isDone);
  const start=new Date(TODAY);start.setUTCDate(start.getUTCDate()-RANGE);
  const createdR=scoped.filter(i=>D(i.created)&&D(i.created)>=start);
  const closedR=closedAll.filter(i=>D(i.updated)&&D(i.updated)>=start);
  const overdue=open.filter(i=>i.dueDate&&D(i.dueDate)<TODAY);
  const stale=open.filter(i=>D(i.updated)&&days(D(i.updated),TODAY)>CFG.staleDays);
  const net=createdR.length-closedR.length;
  const perDay=closedR.length/RANGE;
  const forecast=(perDay>0&&net<0)?(()=>{const d=new Date(TODAY);d.setUTCDate(d.getUTCDate()+Math.round(open.length/perDay));return fmtDate(d);})():null;
  const overduePct=open.length?Math.round(overdue.length/open.length*100):0;
  const stalePct=open.length?Math.round(stale.length/open.length*100):0;
  const medAge=median(open.map(age).filter(x=>x!=null));
  // planned intake (V1 07.31 — stakeholder feedback): categories declared in
  // config plannedCategories are INTENTIONAL work sources — their new tickets
  // are forward progress, not backlog leakage. Intent can only come from
  // config, never from the data itself.
  const PSET=new Set(PCFG.planned||[]);
  const crPlan=PSET.size?createdR.filter(i=>PSET.has(sub(i))).length:0;
  const crOther=createdR.length-crPlan;
  // previous window (health trend arrow + move section comparisons)
  const pstart=new Date(TODAY);pstart.setUTCDate(pstart.getUTCDate()-RANGE*2);
  const createdP=scoped.filter(i=>D(i.created)&&D(i.created)>=pstart&&D(i.created)<start);
  const closedP=closedAll.filter(i=>D(i.updated)&&D(i.updated)>=pstart&&D(i.updated)<start);
  // health (V1 07.31 — redesigned): the signal is inflow vs throughput
  // (処理率 = closed ÷ unplanned inflow, %). Stale/overdue have their own
  // cards and no longer vote here; 999 = no inflow, null = no flow at all.
  const hRate=(cr,cl)=>{const base=PSET.size?cr.filter(i=>!PSET.has(sub(i))).length:cr.length;
    return base>0?Math.round(cl.length/base*100):(cl.length>0?999:null);};
  const rate=hRate(createdR,closedR), rateP=hRate(createdP,closedP);
  const hTrend=(rate!=null&&rateP!=null)?(rate-rateP>CFG.health.trendBand?'up':rateP-rate>CFG.health.trendBand?'down':'flat'):null;
  const health=rate==null?'warn':rate>=CFG.health.rateGood?'good':rate>=CFG.health.rateWarn?'warn':'crit';
  // status buckets (incl closed)
  const status={Open:0,InProgress:0,Resolved:0,Pending:0,Closed:0};
  scoped.forEach(i=>status[bkt(i)]++);
  // real per-project statuses (names/colors straight from Backlog)
  const byId={}; scoped.forEach(i=>{byId[i.stId]=(byId[i.stId]||0)+1;});
  const sfull=(SFULL||[]).map(s=>({...s,n:byId[s.id]||0})).filter(s=>s.n>0);
  // areas (per-project config: category → business area) — engagement share per
  // assignee ≈ tickets ACTIVE (updated) within the selected range, any status
  let areas=null;
  if(PCFG.areas&&PCFG.areas.rules){
    const rules=PCFG.areas.rules.map(r=>({...r,_re:(r.titleMatch||[]).map(p=>new RegExp(p,'i'))}));
    /* an issue's area — two passes: ① exact signals (category / issue type),
       ② title patterns as fallback. So a typed issue never gets stolen by a
       title keyword belonging to a later rule. */
    const areaOf=i=>{const cs=i.category||[];const ty=i.type||'';const s=i.summary||'';
      let r=rules.find(r=>((r.match||[]).length&&cs.some(c=>r.match.includes(c)))||(r.typeMatch||[]).includes(ty));
      if(!r)r=rules.find(r=>r._re.some(re=>re.test(s)));
      return r?r.id:'_other';};
    const act=scoped.filter(i=>i.assignee&&D(i.updated)&&D(i.updated)>=start);
    const AM={},ALL={total:0,by:{}};
    act.forEach(i=>{const a=AM[i.assignee]=AM[i.assignee]||{total:0,by:{}};const k=areaOf(i);
      a.total++;a.by[k]=(a.by[k]||0)+1;ALL.total++;ALL.by[k]=(ALL.by[k]||0)+1;});
    areas={ids:[...rules.map(r=>r.id),'_other'],all:ALL,
      members:Object.entries(AM).map(([n,v])=>({name:n,total:v.total,by:v.by})).sort((a,b)=>b.total-a.total)};
  }
  // members
  const M={};
  open.forEach(i=>{const a=i.assignee||'—';(M[a]=M[a]||{open:0,over:0,stale:0,ages:[],st:{Open:0,InProgress:0,Resolved:0,Pending:0,Closed:0}});
    M[a].open++;M[a].st[bkt(i)]++;const ag=age(i);if(ag!=null)M[a].ages.push(ag);
    if(i.dueDate&&D(i.dueDate)<TODAY)M[a].over++; if(D(i.updated)&&days(D(i.updated),TODAY)>CFG.staleDays)M[a].stale++;});
  const members=Object.entries(M).map(([n,v])=>({name:n,open:v.open,over:v.over,stale:v.stale,med:median(v.ages),st:v.st}))
    .sort((a,b)=>b.open-a.open);
  // categories — same 5 status buckets as everywhere else (unified 07.28)
  const C={};
  scoped.forEach(i=>{const k=sub(i);if(k==='—')return;(C[k]=C[k]||{st:{Open:0,InProgress:0,Resolved:0,Pending:0,Closed:0},total:0});
    C[k].st[bkt(i)]++;C[k].total++;});
  const cats=Object.entries(C).map(([n,v])=>({name:n,st:v.st,total:v.total,done:v.st.Closed}))
    .sort((a,b)=>b.total-a.total).slice(0,12);
  // per-category dwell (V1 07.31): median age of OPEN tickets — feeds the
  // summary bullet that replaced "largest category" (count alone ≠ insight)
  const CA={};
  open.forEach(i=>{const k=sub(i);if(k==='—')return;const g=age(i);if(g!=null)(CA[k]=CA[k]||[]).push(g);});
  const catAge=Object.entries(CA).map(([n,xs])=>({name:n,med:median(xs),n:xs.length}))
    .sort((a,b)=>b.med-a.med);
  // flow buckets follow RANGE (07.28): 7d/30d → daily bars, 90d → 13 weekly.
  // lx = draw an x-axis label for this bucket (sparse on the 30-day view: Mondays only)
  let wd;
  const bucketStat=(from,to,label,lx)=>{
    const cr=scoped.filter(i=>D(i.created)&&D(i.created)>=from&&D(i.created)<=to).length;
    const cl=closedAll.filter(i=>D(i.updated)&&D(i.updated)>=from&&D(i.updated)<=to).length;
    const base=open.filter(i=>D(i.created)&&D(i.created)<=to);
    const st=base.filter(i=>D(i.updated)&&days(D(i.updated),TODAY)>CFG.staleDays);
    return{label,lx,cr,cl,net:cr-cl,stale:base.length?Math.round(st.length/base.length*100):0};};
  if(RANGE<=30){
    wd=[];for(let k=RANGE-1;k>=0;k--){const d0=new Date(TODAY);d0.setUTCDate(d0.getUTCDate()-k);
      wd.push(bucketStat(d0,d0,`${d0.getUTCMonth()+1}/${d0.getUTCDate()}`,RANGE===7||d0.getUTCDay()===1));}
  }else{
    wd=[];for(let w=12;w>=0;w--){const wk=monday(TODAY);wk.setUTCDate(wk.getUTCDate()-w*7);
      const end=new Date(wk);end.setUTCDate(end.getUTCDate()+6);
      wd.push(bucketStat(wk,end,`${wk.getUTCMonth()+1}/${wk.getUTCDate()}`,true));}
  }
  // in-period movement (07.28): what actually happened inside RANGE — created vs
  // closed per type/category, top finishers, median cycle time (vs previous
  // window — createdP/closedP computed above with the health trend)
  const cycOf=list=>median(list.map(i=>D(i.created)&&D(i.updated)?days(D(i.created),D(i.updated)):null).filter(x=>x!=null));
  const MV={};
  createdR.forEach(i=>{const k=sub(i);if(k==='—')return;(MV[k]=MV[k]||{cr:0,cl:0}).cr++;});
  closedR.forEach(i=>{const k=sub(i);if(k==='—')return;(MV[k]=MV[k]||{cr:0,cl:0}).cl++;});
  const FIN={};closedR.forEach(i=>{const a=i.assignee;if(a)FIN[a]=(FIN[a]||0)+1;});
  // V1 07.31: keep the top-8 most ACTIVE categories, but ORDER them by net
  // (new − closed) — the stakeholder-requested view is "who outpaces closing"
  const mvAll=Object.entries(MV).map(([n,v])=>({name:n,...v,net:v.cr-v.cl}));
  const move={cats:[...mvAll].sort((a,b)=>(b.cr+b.cl)-(a.cr+a.cl)).slice(0,8).sort((a,b)=>b.net-a.net),
    over:[...mvAll].sort((a,b)=>b.net-a.net)[0]||null,
    fin:Object.entries(FIN).map(([n,c])=>({name:n,n:c})).sort((a,b)=>b.n-a.n).slice(0,5),
    cyc:cycOf(closedR),cycP:cycOf(closedP),crP:createdP.length,clP:closedP.length};
  // delayed list
  const delayed=[...overdue].sort((a,b)=>D(a.dueDate)-D(b.dueDate)).slice(0,10)
    .map(i=>({name:i.assignee||'—',key:i.key,status:bkt(i),title:i.summary||'',due:i.dueDate?fmtDate(D(i.dueDate)):'—',over:days(D(i.dueDate),TODAY)}));
  return{scoped,open,closedAll,createdR,closedR,overdue,stale,net,perDay,forecast,overduePct,stalePct,medAge,health,rate,rateP,hTrend,crPlan,crOther,planned:PSET.size>0,status,sfull,areas,members,cats,catAge,wd,move,delayed};
}

/* ============ render ============ */
function statusMix(st,style='width:76px'){
  const tot=Object.values(st).reduce((a,b)=>a+b,0)||1;const order=['InProgress','Open','Resolved','Pending','Closed'];
  return `<span class="sbar" style="${style}">`+order.map(k=>`<i style="width:${st[k]/tot*100}%;background:${BORDER[k]}"></i>`).join('')+`</span>`;
}
function riskChip(med){const t=T();if(med>=CFG.riskMed.high)return `<span class="chip bg-r">${t.risk_h}</span>`;if(med>=CFG.riskMed.mid)return `<span class="chip bg-a">${t.risk_m}</span>`;return `<span class="chip bg-g">${t.risk_l}</span>`;}

function assigneeLink(name){
  if(!name||!CONF||!CONF.space) return name||'—';
  const id=A2ID[name]; if(!id) return name;
  /* replicate the URL Backlog's own UI produces for an assignee filter (verified live 07.28):
     /find/<PK>?assigneeId=<id>&assignerId=<id>&projectId=<pid>&sort=UPDATED */
  const pid=CONF.pid?`&projectId=${CONF.pid}`:'';
  return `<a class="lnk" href="https://${CONF.space}/find/${CONF.pk}?assigneeId=${id}&assignerId=${id}${pid}&limit=20&offset=0&sort=UPDATED" target="_blank" rel="noopener">${name}</a>`;
}
function ticketLink(key,label){
  const s=(label||'').replace(/</g,'&lt;');
  if(!key||!CONF||!CONF.space) return s;
  return `<a class="lnk" href="https://${CONF.space}/view/${key}" target="_blank" rel="noopener">${s}</a>`;
}
/* AI-insight bullet: plain text in, escaped; **bold** and ticket keys (ABC-123 → Backlog link) */
function mdIns(s){
  let h=String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  h=h.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
  h=h.replace(/\b([A-Z][A-Z0-9_]{2,}-\d+)\b/g,(m,k)=>CONF&&CONF.space?`<a class="lnk" href="https://${CONF.space}/view/${k}" target="_blank" rel="noopener">${k}</a>`:k);
  return h;
}
function renderHero(m){
  const t=T();const r=RANGE;
  const s={r,created:m.createdR.length,closed:m.closedR.length,net:m.net,open:m.open.length,
    overdue:m.overdue.length,overduePct:m.overduePct,stale:m.stale.length,stalePct:m.stalePct,forecast:m.forecast,
    planned:m.planned,crPlan:m.crPlan,crOther:m.crOther,rate:m.rate,rateP:m.rateP,inflow:m.crOther};
  const lvl=c=>c==='r'?t.crit:c==='a'?t.warn:t.good;
  /* V1 07.31: growth is not framed as bad by default — amber only when the
     UNPLANNED inflow alone outpaces closing; planned-driven growth stays neutral */
  const trendCls=m.net>0?(m.crOther>m.closedR.length?'a':'b'):m.net<0?'g':'b';
  const overCls=m.overduePct>=CFG.overdue.crit?'r':m.overduePct>=CFG.overdue.warn?'a':'g';
  const staleCls=m.stalePct>=CFG.stale.crit?'r':m.stalePct>=CFG.stale.warn?'a':'g';
  const hCls=m.health==='crit'?'r':m.health==='warn'?'a':'g';
  const hEmoji=hCls==='r'?'🔴':hCls==='a'?'🟡':'🟢';
  const hArr=m.hTrend==='up'?' ↗':m.hTrend==='down'?' ↘':m.hTrend==='flat'?' →':'';
  const hTxt=(m.health==='crit'?t.crit:m.health==='warn'?t.warn:t.good)+hArr;
  const cards=[
    {tone:'b',emoji:'📋',lbl:t.k_open,val:m.open.length,unit:'',mean:t.m_open(s),chip:''},
    {tone:trendCls,emoji:m.net>0?'📈':m.net<0?'📉':'▬',lbl:t.k_trend,val:(m.net>0?'+':'')+m.net,unit:m.net>0?'▲':m.net<0?'▼':'',mean:t.m_trend(s),chip:m.net>0?t.up:m.net<0?t.down:t.flat},
    {tone:overCls,emoji:'⏰',lbl:t.k_over,val:m.overduePct,unit:'%',mean:t.m_over(s),chip:lvl(overCls)},
    {tone:staleCls,emoji:'🕒',lbl:t.k_stale,val:m.stalePct,unit:'%',mean:t.m_stale(s),chip:lvl(staleCls)},
    {tone:hCls,emoji:'🩺',lbl:t.k_health,pill:`<span class="hpill bg-${hCls}">${hEmoji} ${hTxt}</span>`,mean:t.m_health(s),chip:''},
  ];
  $('#hero').innerHTML=cards.map(c=>`<div class="kcard tone-${c.tone}"><div class="top-dot dot-${c.tone}"></div>
    <div class="klbl"><span class="kem">${c.emoji}</span>${c.lbl}${c.chip?`<span class="ktag bg-${c.tone}">${c.chip}</span>`:''}</div>
    ${c.pill?`<div class="kpill">${c.pill}</div>`:`<div class="kval mono ${c.tone}">${c.val}${c.unit?`<span class="kunit">${c.unit}</span>`:''}</div>`}
    <div class="kmean">${c.mean}</div></div>`).join('');
}

function renderInsight(m){
  const t=T();const dir=m.net>0?t.up:m.net<0?t.down:t.flat;
  /* V1 07.31 (stakeholder feedback): summary bullets carry actionable angles —
     longest-dwelling category + new-exceeds-closed category. No personal names
     in this layer (names live in the operational tables below). */
  /* floor n>=3: a lone ancient ticket in a typo/niche category is noise, not
     the dwell story — fall back to the raw top only if nothing clears it */
  const stagCat=(m.catAge||[]).filter(c=>c.n>=3)[0]||(m.catAge||[])[0];
  const overCat=m.move&&m.move.over&&m.move.over.net>0?m.move.over:null;
  const p1=`<span class="hl">${scopeName(SCOPE)}</span>: ${m.open.length}${LANG==='ja'?'件オープン':LANG==='vi'?' đang mở':' open'}, `+

  const bullets=[

  ];

  if(overCat)bullets.push(LANG==='ja'?`新規超過カテゴリ: ${overCat.name}（新規${overCat.cr}・完了${overCat.cl} ＝ +${overCat.net}）`:LANG==='vi'?`Nhóm tạo vượt đóng: ${overCat.name} (tạo ${overCat.cr} / đóng ${overCat.cl} = +${overCat.net})`:`New exceeds closed: ${overCat.name} (${overCat.cr} new / ${overCat.cl} closed = +${overCat.net})`);
  $('#insight').innerHTML=`<h2>💡 ${t.ins_title}</h2><p>${p1} ${p2}</p><ul>${bullets.map(b=>`<li>${b}</li>`).join('')}</ul>`;
}

function trendSVG(wd){
  const W=920,H=200,pl=34,pr=34,pt=14,pb=26;const iw=W-pl-pr,ih=H-pt-pb;
  const maxB=Math.max(1,...wd.map(w=>Math.max(w.cr,w.cl)));const bw=iw/wd.length;
  const x=i=>pl+i*bw, y=v=>pt+ih-(v/maxB)*ih;
  const g='var(--grid)',mut='var(--muted)';
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="trend">`;
  for(let k=0;k<=4;k++){const gy=pt+ih*(k/4),vv=Math.round(maxB*(1-k/4));s+=`<line x1="${pl}" y1="${gy}" x2="${W-pr}" y2="${gy}" stroke="${g}"/><text x="${pl-6}" y="${gy+3}" font-size="9" fill="${mut}" text-anchor="end">${vv}</text>`;}
  wd.forEach((w,i)=>{const cx=x(i)+bw*0.5;const bwid=Math.min(14,bw*0.32);
    s+=`<rect x="${cx-bwid-1}" y="${y(w.cr)}" width="${bwid}" height="${pt+ih-y(w.cr)}" rx="1.5" fill="var(--faint)" opacity=".85"/>`;
    s+=`<rect x="${cx+1}" y="${y(w.cl)}" width="${bwid}" height="${pt+ih-y(w.cl)}" rx="1.5" fill="var(--st-closed)"/>`;
    if(w.lx!==false)s+=`<text x="${cx}" y="${H-9}" font-size="9" fill="${mut}" text-anchor="middle">${w.label}</text>`;});
  const ry=v=>pt+ih-(v/100)*ih;
  let pts=wd.map((w,i)=>`${x(i)+bw*0.5},${ry(w.stale)}`).join(' ');
  s+=`<polyline points="${pts}" fill="none" stroke="var(--amber)" stroke-width="1.6" stroke-dasharray="4 3"/>`;
  wd.forEach((w,i)=>{s+=`<circle cx="${x(i)+bw*0.5}" cy="${ry(w.stale)}" r="2" fill="var(--amber)"/>`;});
  s+=`</svg>`;return s;
}

function freshInfo(){

  return {d,cls:d>CFG.fresh.crit?'r':d>CFG.fresh.warn?'a':'g',text:`${t.updated}: ${META.generatedAt||META.generated} · ${d===0?t.today_:t.daysAgo(d)}`};

async function deriveKek(pass,salt,iter,usages){
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:iter,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,usages);
}
async function decryptData(pass){
  const b=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
  if(ENC.slots){ /* v2 envelope: try each key slot — master pass opens every page,
                    a per-project pass only its own (07.28) */
    for(const sl of ENC.slots){
      try{
        const kek=await deriveKek(pass,b(sl.salt),sl.iter,['decrypt']);
        const dekRaw=await crypto.subtle.decrypt({name:'AES-GCM',iv:b(sl.iv)},kek,b(sl.wk));
        const dek=await crypto.subtle.importKey('raw',dekRaw,'AES-GCM',false,['decrypt']);
        const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b(ENC.iv)},dek,b(ENC.ct));
        return new TextDecoder().decode(pt);
      }catch(e){}
    }
    throw new Error('wrong passphrase');
  }
  /* v1 direct (legacy pages) */
  const key=await deriveKek(pass,b(ENC.salt),ENC.iter,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b(ENC.iv)},key,b(ENC.ct));
  return new TextDecoder().decode(pt);
}

}
const slugIndex=s=>PROJECTS?PROJECTS.findIndex(p=>p.slug===s):-1;
const CVAR={Open:'--st-open',InProgress:'--st-inprog',Resolved:'--st-resolved',Pending:'--st-pending',Closed:'--st-closed'};
function loadProject(i){

  RAW=p.RAW; CONF=p.conf; SMAP=p.SMAP||{}; PCFG=p.cfg||{}; SFULL=p.statuses||[]; INSW=p.insight||null;
  /* bucket colors = the project's real Backlog status colors (API); fallback = Backlog standard palette */
  const cols=p.colors||{}; for(const k in CVAR) document.documentElement.style.setProperty(CVAR[k],cols[k]||'');

  renderProjNav(); renderAll();

}

function parseHash(){
  const h=location.hash.slice(1); if(!h)return{};

  return a.startsWith('sec-')?{sec:a}:{slug:a};
}

/* Web Push (Phase 2): bell shows only when the unlocked payload carries push
   config AND the browser supports push. Toggle = subscribe/unsubscribe; the
   worker stores subscriptions, GitHub Actions sends after scheduled builds. */
function u8(b64){const s=atob(b64.replace(/-/g,'+').replace(/_/g,'/'));const a=new Uint8Array(s.length);for(let i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return a;}
/* push config mirror for the SW (08.06): pushsubscriptionchange fires in the SW
   with no page open, so the worker URL/verifier/VAPID key it needs to re-register
   are kept in IndexedDB — device-local, same trust level as the remembered
   passphrase key that already lives there. Cleared on manual unsubscribe. */
function pushCfgSave(){try{const r=indexedDB.open('tlk-push',1);r.onupgradeneeded=()=>r.result.createObjectStore('cfg');r.onsuccess=()=>{try{r.result.transaction('cfg','readwrite').objectStore('cfg').put({url:PUSH.url,v:PUSH.v,pub:PUSH.pub},'push');}catch(_){}};}catch(_){}}
function pushCfgClear(){try{const r=indexedDB.open('tlk-push',1);r.onupgradeneeded=()=>r.result.createObjectStore('cfg');r.onsuccess=()=>{try{r.result.transaction('cfg','readwrite').objectStore('cfg').delete('push');}catch(_){}};}catch(_){}}
async function initPush(){
  if(!PUSH||!('serviceWorker' in navigator)||!('PushManager' in window)||typeof Notification==='undefined')return;
  if(!location.protocol.startsWith('http')||Notification.permission==='denied')return;
  const b=$('#btn-push');b.style.display='';
  try{const reg=await navigator.serviceWorker.ready;
    let sub=await reg.pushManager.getSubscription();
    /* self-heal (08.06): Android repeatedly invalidates Chrome's FCM registration
       (3 silent deaths in 4 days) and the browser can keep showing a live-looking
       subscription the push service already 410'd. So on every unlocked open of a
       device that opted in: no sub → silently re-subscribe (permission already
       granted, no prompt); with sub → re-POST to the worker (upsert by endpoint)
       so a registry-side prune heals too. Opt-in memory = localStorage flag; a
       pre-flag device that still holds a subscription arms itself. */
    if(sub&&!localStorage.getItem('tl_dash_push'))localStorage.setItem('tl_dash_push','1');
    if(localStorage.getItem('tl_dash_push')==='1'&&Notification.permission==='granted'){
      if(!sub){try{sub=await _to(reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:u8(PUSH.pub)}),15000);}catch(_){}}
      if(sub){pushCfgSave();
        _to(fetch(PUSH.url+'/sub',{method:'POST',headers:{'content-type':'application/json'},
          body:JSON.stringify({v:PUSH.v,sub:sub.toJSON()})}),10000).catch(()=>{});}
    }
    b.classList.toggle('on',!!sub);}catch(_){}
}
let _toastT=null;
function toast(msg){const el=$('#pushtoast');el.textContent=msg;el.classList.add('show');
  clearTimeout(_toastT);_toastT=setTimeout(()=>el.classList.remove('show'),3200);}
const _to=(p,ms)=>Promise.race([p,new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),ms))]);
$('#btn-push').addEventListener('click',async()=>{
  const b=$('#btn-push'),t=T();
  if(b.classList.contains('busy'))return;   // ignore double taps mid-flight
  b.classList.add('busy');
  try{
    const reg=await _to(navigator.serviceWorker.ready,8000);
    const cur=await reg.pushManager.getSubscription();
    if(cur){
      await _to(fetch(PUSH.url+'/sub',{method:'DELETE',headers:{'content-type':'application/json'},
        body:JSON.stringify({v:PUSH.v,endpoint:cur.endpoint})}),8000).catch(()=>{});
      await cur.unsubscribe();b.classList.remove('on');localStorage.removeItem('tl_dash_push');pushCfgClear();toast(t.push_off);return;
    }
    if(await Notification.requestPermission()!=='granted'){toast(t.push_denied);return;}
    const sub=await _to(reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:u8(PUSH.pub)}),15000);
    const r=await _to(fetch(PUSH.url+'/sub',{method:'POST',headers:{'content-type':'application/json'},
      body:JSON.stringify({v:PUSH.v,sub:sub.toJSON()})}),10000);
    if(r.ok){b.classList.add('on');localStorage.setItem('tl_dash_push','1');pushCfgSave();toast(t.push_on);}
    else{await sub.unsubscribe();toast(t.push_err);}
  }catch(_){toast(T().push_err);}
  finally{b.classList.remove('busy');}
});

/* ============ export (08.03): PDF via print + static single-file HTML ============
   Client-side by design: the DOM already shows exactly the chosen project and
   filter combination, so "export what you see" needs no build-time artifacts and
   no PDF library (native print = correct JP/VN fonts, user saves as PDF).
   Prep = open every section + force light theme; restored afterwards. The
   per-assignee area list keeps only its first page (.hid rows stay hidden). */
let _pp=null;
function expPrep(){ if(_pp)return;
  _pp={open:[...document.querySelectorAll('details.sec')].map(d=>d.open),theme:document.documentElement.dataset.theme||'light'};
  document.querySelectorAll('details.sec').forEach(d=>d.open=true);
  document.documentElement.dataset.theme='light';syncTC();
}
function expRestore(){ if(!_pp)return;
  [...document.querySelectorAll('details.sec')].forEach((d,i)=>d.open=_pp.open[i]);
  document.documentElement.dataset.theme=_pp.theme;syncTC();_pp=null;
}
/* Ctrl+P / browser print gets the same prep — the pair is idempotent via _pp */
window.addEventListener('beforeprint',expPrep);
window.addEventListener('afterprint',expRestore);
function exportHTML(){
  expPrep();
  const c=document.documentElement.cloneNode(true);
  expRestore();
  /* static snapshot: strip scripts + interactive chrome; <details> keep working
     natively without JS. Rendered DOM only — the raw dataset is NOT embedded. */
  c.querySelectorAll('script,link[rel="manifest"],#lock,.util,.projnav,.controls,#totop,#pushtoast,.stalebar,.expwrap,.share,.morebtn').forEach(e=>e.remove());
  const nm=(PROJECTS&&PROJECTS[PI]&&(PROJECTS[PI].slug||PROJECTS[PI].name))||PAGESLUG||'dashboard';
  const ti=c.querySelector('title');if(ti)ti.textContent=`${nm} · TLダッシュボード · ${META.today}`;
  const blob=new Blob(['<!DOCTYPE html>\n'+c.outerHTML],{type:'text/html;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download=`dashboard-${nm}-${(META.today||'').replace(/-/g,'')}.html`;
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);
}
(()=>{const b=$('#btn-export'),m=$('#expmenu');if(!b)return;
  b.addEventListener('click',e=>{e.stopPropagation();m.hidden=!m.hidden;});
  document.addEventListener('click',()=>{m.hidden=true;});

/* sticky filter bar: add .stuck (shadow + compact) once scrolled past its resting spot */
(()=>{const c=$('#controls');if(!c)return;const s=document.createElement('div');
  c.parentNode.insertBefore(s,c);

/* back to top + snapshot-zone signal: once the reader scrolls past the snapshot
   divider, the period control dims (those sections ignore it) */
(()=>{const b=$('#totop');if(!b)return;
  const c=$('#controls');
  window.addEventListener('scroll',()=>{
    b.classList.toggle('show',window.scrollY>500);
    const sd=document.getElementById('snapdiv');
    if(c)c.classList.toggle('snapzone',!!sd&&sd.getBoundingClientRect().top<110);

  b.onclick=()=>window.scrollTo({top:0,behavior:'smooth'});})();

/* Unified bootstrap. Data contract (injected at /*__DATA__* / by build.py):
     const META={today,generated}; const BUILD={updateUrl};
     let PROJECTS=[{slug,name,conf,SMAP,RAW,cfg}, …]          — plaintext build
   or
     const ENC={v,salt,iv,iter,ct}; let PROJECTS=null;        — encrypted build
   where ENC.ct decrypts to {projects:[…]} (same shape). 1 project → nav hidden. */
function initProjects(){
  $('#projnav').addEventListener('click',e=>{const b=e.target.closest('button'); if(b) loadProject(+b.dataset.pi);});
  window.addEventListener('hashchange',()=>{
    const h=parseHash();
    if(h.sec)PENDING_SEC=h.sec;
    const i=h.slug!=null?slugIndex(h.slug):-1;
    if(i>=0&&i!==PI)loadProject(i); else applyPendingSec();
  });
  const h=parseHash();
  if(h.sec)PENDING_SEC=h.sec;
  const i=h.slug!=null?slugIndex(h.slug):-1;
  loadProject(i>=0?i:0);
}
/* Remembered passphrases are SITE-WIDE (07.28): unlock once anywhere → every page
   this browser can decrypt opens without asking (master passphrase = all pages).
   A pass that fails on a page is simply skipped — stakeholder scoping stays intact.
   HARDENED (07.28 rev2): never stored in the clear — the list is AES-GCM-encrypted
   under a NON-EXTRACTABLE CryptoKey kept in IndexedDB, so profile copies / DevTools
   inspection see only ciphertext; unwrapping requires code running in this origin.
   Legacy plaintext entries are migrated once, then deleted. */
const MKEY='tl_meta';
/* if IndexedDB is unavailable/hangs (odd embedders), remembering is skipped —
   never fall back to storing anything in the clear */
const _idbTO=(p,ms)=>Promise.race([p,new Promise((_,rej)=>setTimeout(()=>rej(new Error('idb timeout')),ms))]);
function idbKey(){return _idbTO(new Promise((res,rej)=>{
  const r=indexedDB.open('tlk',1);
  r.onupgradeneeded=()=>r.result.createObjectStore('k');
  r.onerror=()=>rej(r.error);
  r.onsuccess=()=>{const db=r.result;
    const g=db.transaction('k').objectStore('k').get(1);
    g.onerror=()=>{db.close();rej(g.error);};
    g.onsuccess=async()=>{
      if(g.result){res(g.result);db.close();return;}
      const k=await crypto.subtle.generateKey({name:'AES-GCM',length:256},false,['encrypt','decrypt']);
      const tx=db.transaction('k','readwrite');tx.objectStore('k').put(k,1);
      tx.oncomplete=()=>{res(k);db.close();};tx.onerror=()=>{db.close();rej(tx.error);};
    };};}),1500);}
async function savePasses(l){
  try{const k=await idbKey();const iv=crypto.getRandomValues(new Uint8Array(12));
    const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},k,new TextEncoder().encode(JSON.stringify(l)));
    const b64=a=>btoa(String.fromCharCode(...new Uint8Array(a)));
    localStorage.setItem(MKEY,JSON.stringify({iv:b64(iv),ct:b64(ct)}));}catch(e){}}
async function storedPasses(){
  let l=[];
  try{const raw=localStorage.getItem(MKEY);
    if(raw){const o=JSON.parse(raw);const k=await idbKey();
      const b=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
      l=JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b(o.iv)},k,b(o.ct))));}
  }catch(e){l=[];}
  try{/* one-time migration of pre-hardening plaintext entries */
    let old=[]; try{old=JSON.parse(localStorage.getItem('tl_dash_pws'))||[];}catch(e){}
    const oldP=localStorage.getItem('tl_dash_pw:'+location.pathname)||localStorage.getItem('tl_dash_pw');
    if(oldP)old.push(oldP);
    const fresh=old.filter(p=>p&&!l.includes(p));
    if(fresh.length){l=[...fresh,...l].slice(0,4);await savePasses(l);}
    ['tl_dash_pws','tl_dash_pw','tl_dash_pw:'+location.pathname].forEach(k=>localStorage.removeItem(k));
  }catch(e){}
  return l;
}
async function rememberPass(p){const l=(await storedPasses()).filter(x=>x!==p);l.unshift(p);await savePasses(l.slice(0,4));}
let PUSH=null;   // web-push config — only present inside encrypted payloads
async function doUnlock(pass,fromStore){            // throws on wrong pass
  const _o=JSON.parse(await decryptData(pass)); PROJECTS=_o.projects; CROSS=_o.cross||null; PUSH=_o.push||null;
  /* remember automatically (07.28): ask only on a new device or after rotation */
  await rememberPass(pass);
  $('#lock').style.display='none'; initProjects(); maybePulse(); initPush();
}
if(typeof ENC!=='undefined'&&ENC){     // encrypted payload → lock screen (unless remembered)
  const t=T(),lk=$('#lock');
  $('#lockttl').textContent=t.title;
  const f=freshInfo(),lf=$('#lockfresh'); lf.className='fresh '+f.cls; lf.textContent=f.text;
  $('#lockmsg').textContent=t.lockMsg; $('#unlockbtn').textContent=t.unlock;
  lk.addEventListener('submit',async e=>{ e.preventDefault(); $('#pwerr').style.display='none';
    try{ await doUnlock($('#pw').value,false); }
    catch(err){ $('#pwerr').textContent=t.wrongPass; $('#pwerr').style.display='block'; } });
  (async()=>{ /* try every remembered passphrase; first that decrypts wins */
    for(const p of await storedPasses()){ try{ await doUnlock(p,true); return; }catch(e){} }
    lk.style.display='flex'; $('#pw').focus();
  })();
} else if(PROJECTS){ initProjects(); maybePulse(); }
/* PWA (07.29): register the root service worker — offline shell. Skips
   file:// snapshots (no http) and old browsers; failures are silent. */
if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  addEventListener('load',()=>{ navigator.serviceWorker.register('../sw.js').catch(()=>{}); });
}
